name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare Godot Android environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/editor_settings-4.4.tres"
          mkdir -p "$HOME/.android"
          cp /root/debug.keystore "$HOME/.android/debug.keystore"
          sed -i 's@/root/debug.keystore@'$HOME'/.android/debug.keystore@g' "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Create build directory
        run: mkdir -p build
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/Bomberman8Bit.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman8Bit-APK
          path: build/Bomberman8Bit.apk
          if-no-files-found: error
          retention-days: 14
